name: foodgo
description: Lamón - Filipino Cuisine Ordering and Payment System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/lamon_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/lamon_app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
